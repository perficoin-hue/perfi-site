
name: PERFI Website Builder Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: copilot/ai-website-builder
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update compatible dependencies
        run: |
          npm install --save-exact next@15.5.29 @opennextjs/cloudflare@1.20.17

      - name: Verify installed versions
        run: npm ls next @opennextjs/cloudflare react react-dom

      - name: Verify lockfile installation
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Commit verified dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "Fix Next.js and OpenNext Cloudflare compatibility"
            git push origin HEAD:copilot/ai-website-builder
          fi
